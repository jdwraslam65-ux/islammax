<!doctype html>
<html lang="ar" dir="rtl">
    <head>
        <meta charset="UTF-8" />
        <link rel="icon" type="image/svg+xml" href="/vite.svg" />
        <meta name="generator" content="Islam Mx" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Noto+Naskh+Arabic:wght@400;500;600&display=swap"
            rel="stylesheet"
        />
        <title>Bac MX - منصة إسلام ماكس</title>
        <meta name="google-site-verification" content="SnwIqZT5ZShgtU04OpdpRL21KBJP3L_H7664Y7sE0TU" />
        <meta name="description" content="منصة إسلام ماكس التعليمية لدروس الرياضيات والتحضير للبكالوريا. ملخصات وفيديوهات Full HD.">
    </head>
    <body>
        <div id="root"></div>
 
        <!-- Countdown Styles -->
        <style>
            #cd-fab {
                position: fixed;
                bottom: 28px;
                left: 28px;
                width: 58px;
                height: 58px;
                border-radius: 50%;
                background: rgba(255,255,255,0.12);
                backdrop-filter: blur(20px) saturate(180%);
                -webkit-backdrop-filter: blur(20px) saturate(180%);
                border: 1px solid rgba(255,255,255,0.25);
                box-shadow: 0 8px 32px rgba(0,0,0,0.3), inset 0 1px 0 rgba(255,255,255,0.3);
                display: flex;
                align-items: center;
                justify-content: center;
                font-size: 24px;
                cursor: pointer;
                z-index: 9999;
                transition: transform 0.3s cubic-bezier(0.34,1.56,0.64,1), box-shadow 0.3s;
            }
            #cd-fab:hover {
                transform: scale(1.12) rotate(8deg);
                box-shadow: 0 12px 40px rgba(99,102,241,0.4), inset 0 1px 0 rgba(255,255,255,0.4);
            }
 
            #cd-overlay {
                display: none;
                position: fixed;
                inset: 0;
                background: rgba(0,0,0,0.55);
                backdrop-filter: blur(12px);
                -webkit-backdrop-filter: blur(12px);
                z-index: 10000;
                align-items: center;
                justify-content: center;
            }
            #cd-overlay.active { display: flex; }
 
            .cd-modal {
                position: relative;
                width: 90%;
                max-width: 480px;
                border-radius: 32px;
                padding: 40px 32px 36px;
                text-align: center;
                /* Liquid Glass layers */
                background: rgba(255,255,255,0.09);
                backdrop-filter: blur(60px) saturate(200%);
                -webkit-backdrop-filter: blur(60px) saturate(200%);
                border: 1px solid rgba(255,255,255,0.22);
                box-shadow:
                    0 32px 80px rgba(0,0,0,0.5),
                    inset 0 1.5px 0 rgba(255,255,255,0.35),
                    inset 0 -1px 0 rgba(255,255,255,0.08),
                    inset 1px 0 0 rgba(255,255,255,0.1),
                    inset -1px 0 0 rgba(255,255,255,0.1);
                animation: modalIn 0.45s cubic-bezier(0.34,1.56,0.64,1) both;
            }
 
            /* Specular top highlight */
            .cd-modal::before {
                content: '';
                position: absolute;
                top: 0; left: 10%; right: 10%;
                height: 1.5px;
                border-radius: 999px;
                background: linear-gradient(90deg, transparent, rgba(255,255,255,0.7), transparent);
            }
 
            /* Chromatic inner glow */
            .cd-modal::after {
                content: '';
                position: absolute;
                inset: 0;
                border-radius: 32px;
                background: radial-gradient(ellipse at 50% 0%, rgba(129,140,248,0.25) 0%, transparent 65%);
                pointer-events: none;
            }
 
            @keyframes modalIn {
                from { opacity: 0; transform: scale(0.88) translateY(20px); }
                to   { opacity: 1; transform: scale(1) translateY(0); }
            }
 
            .cd-close {
                position: absolute;
                top: 16px;
                left: 18px;
                width: 32px;
                height: 32px;
                border-radius: 50%;
                background: rgba(255,255,255,0.1);
                border: 1px solid rgba(255,255,255,0.2);
                color: rgba(255,255,255,0.7);
                font-size: 18px;
                line-height: 30px;
                cursor: pointer;
                transition: background 0.2s, transform 0.2s;
                display: flex;
                align-items: center;
                justify-content: center;
            }
            .cd-close:hover { background: rgba(255,255,255,0.2); transform: scale(1.1); }
 
            .cd-title {
                font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
                font-size: 13px;
                font-weight: 700;
                letter-spacing: 3px;
                text-transform: uppercase;
                color: rgba(255,255,255,0.4);
                margin-bottom: 6px;
                position: relative;
                z-index: 1;
            }
            .cd-headline {
                font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
                font-size: 22px;
                font-weight: 800;
                color: white;
                margin-bottom: 28px;
                position: relative;
                z-index: 1;
            }
 
            .cd-grid {
                display: flex;
                justify-content: center;
                gap: 12px;
                position: relative;
                z-index: 1;
            }
 
            .cd-box {
                flex: 1;
                max-width: 96px;
                border-radius: 20px;
                padding: 18px 8px 14px;
                background: rgba(255,255,255,0.07);
                border: 1px solid rgba(255,255,255,0.14);
                box-shadow: inset 0 1px 0 rgba(255,255,255,0.2), 0 4px 16px rgba(0,0,0,0.2);
                position: relative;
                overflow: hidden;
                transition: transform 0.3s;
            }
            .cd-box:hover { transform: translateY(-3px); }
 
            /* Shimmer line at top of each box */
            .cd-box::before {
                content: '';
                position: absolute;
                top: 0; left: 15%; right: 15%;
                height: 1px;
                background: rgba(255,255,255,0.4);
                border-radius: 999px;
            }
 
            .cd-num {
                display: block;
                font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", monospace;
                font-size: 38px;
                font-weight: 900;
                color: white;
                letter-spacing: -1px;
                line-height: 1;
                margin-bottom: 8px;
                text-shadow: 0 0 20px rgba(129,140,248,0.5);
                transition: transform 0.15s;
            }
            .cd-box.tick .cd-num { transform: scale(1.06); }
 
            .cd-label {
                font-size: 11px;
                font-weight: 600;
                color: rgba(255,255,255,0.4);
                letter-spacing: 1px;
            }
 
            /* Color accents per box */
            .cd-box:nth-child(1) { background: rgba(99,102,241,0.12); border-color: rgba(99,102,241,0.25); }
            .cd-box:nth-child(1) .cd-num { text-shadow: 0 0 24px rgba(99,102,241,0.7); }
            .cd-box:nth-child(2) { background: rgba(168,85,247,0.10); border-color: rgba(168,85,247,0.22); }
            .cd-box:nth-child(2) .cd-num { text-shadow: 0 0 24px rgba(168,85,247,0.6); }
            .cd-box:nth-child(3) { background: rgba(236,72,153,0.09); border-color: rgba(236,72,153,0.2); }
            .cd-box:nth-child(3) .cd-num { text-shadow: 0 0 24px rgba(236,72,153,0.5); }
            .cd-box:nth-child(4) { background: rgba(6,182,212,0.09); border-color: rgba(6,182,212,0.2); }
            .cd-box:nth-child(4) .cd-num { text-shadow: 0 0 24px rgba(6,182,212,0.5); }
 
            .cd-footer {
                margin-top: 24px;
                font-size: 12px;
                color: rgba(255,255,255,0.25);
                position: relative;
                z-index: 1;
            }
        </style>
 
        <!-- FAB Button -->
        <div id="cd-fab" onclick="toggleCountdown()" title="الوقت المتبقي للبكالوريا">⏳</div>
 
        <!-- Modal Overlay -->
        <div id="cd-overlay" onclick="closeOverlay(event)">
            <div class="cd-modal">
                <button class="cd-close" onclick="toggleCountdown()">×</button>
                <div class="cd-title">العد التنازلي</div>
                <div class="cd-headline">⏳ باقي على البكالوريا</div>
                <div class="cd-grid">
                    <div class="cd-box" id="box-days">
                        <span class="cd-num" id="days">00</span>
                        <div class="cd-label">يوم</div>
                    </div>
                    <div class="cd-box" id="box-hours">
                        <span class="cd-num" id="hours">00</span>
                        <div class="cd-label">ساعة</div>
                    </div>
                    <div class="cd-box" id="box-minutes">
                        <span class="cd-num" id="minutes">00</span>
                        <div class="cd-label">دقيقة</div>
                    </div>
                    <div class="cd-box" id="box-seconds">
                        <span class="cd-num" id="seconds">00</span>
                        <div class="cd-label">ثانية</div>
                    </div>
                </div>
                <div class="cd-footer">7 جوان 2026 · 08:00 صباحاً</div>
            </div>
        </div>
 
        <script type="module" src="/src/main.jsx"></script>
 
        <script>
            function toggleCountdown() {
                document.getElementById('cd-overlay').classList.toggle('active');
            }
            function closeOverlay(e) {
                if (e.target.id === 'cd-overlay') toggleCountdown();
            }
 
            // ✅ التاريخ الصحيح: 7 جوان 2026
            const target = new Date("June 7, 2026 08:00:00").getTime();
 
            let prevSeconds = -1;
 
            setInterval(() => {
                const now  = new Date().getTime();
                const diff = target - now;
                if (diff < 0) return;
 
                const d = Math.floor(diff / (1000 * 60 * 60 * 24));
                const h = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const m = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
                const s = Math.floor((diff % (1000 * 60)) / 1000);
 
                const pad = n => String(n).padStart(2, '0');
 
                document.getElementById('days').innerText    = pad(d);
                document.getElementById('hours').innerText   = pad(h);
                document.getElementById('minutes').innerText = pad(m);
                document.getElementById('seconds').innerText = pad(s);
 
                // Tick animation on seconds change
                if (s !== prevSeconds) {
                    prevSeconds = s;
                    const box = document.getElementById('box-seconds');
                    box.classList.add('tick');
                    setTimeout(() => box.classList.remove('tick'), 150);
                }
            }, 1000);
        </script>
    </body>
</html>
